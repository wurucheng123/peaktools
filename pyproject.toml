[project]
name = "peaktools-wrc"
version = "0.1.0"
description = ""
authors = [
    {name = "wurucheng123",email = "wurucheng@pumc.edu.cn"}
]
readme = "README.md"
license = "MIT"
keywords = ["bioinformatics", "peak-calling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "fire (>=0.7.1,<0.8.0)",
    "pysam (>=0.23.3,<0.24.0)",
    "seaborn (>=0.13.2,<0.14.0)"
]

[tool.poetry]
packages = [{include = "peaktools", from = "src"}]

[tool.poetry.scripts]
peaktools = "peaktools._cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
